# Add this overlay to a DeepSeek Harness profile after installing codex-scoped-memory.
- insert:
    - id: mcp-scoped-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: scoped_memory
        transport: stdio
        command: scoped-memory-mcp
        cwd: !!js process.cwd()
        env:
          SCOPED_MEMORY_HOME: !!js >-
            process.env.SCOPED_MEMORY_HOME?.trim() || process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.local', 'share', 'scoped-memory')
